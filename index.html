<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0f1a2b">
<title>Piano Note Detector</title>
<style>
  :root {
    --bg: #0f1a2b;
    --card: #182740;
    --line: #26385a;
    --acc: #ff6b4a;
    --ink: #eef3fb;
    --mut: #92a3bd;
  }
  body {
    font-family: system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 16px;
    box-sizing: border-box;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px;
    text-align: center;
    max-width: 500px;
    width: 100%;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .note {
    font-size: 64px;
    font-weight: 800;
    color: var(--acc);
    margin: 10px 0 4px;
    min-height: 80px;
  }
  .freq {
    font-size: 16px;
    color: var(--mut);
    margin-bottom: 20px;
  }
  .keyboard-wrapper {
    overflow-x: auto;
    margin-bottom: 20px;
    padding: 10px 0;
  }
  .keyboard {
    position: relative;
    display: inline-flex;
    height: 120px;
    user-select: none;
  }
  .white-key {
    width: 32px;
    height: 100%;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 0 0 4px 4px;
    box-sizing: border-box;
    position: relative;
    z-index: 1;
  }
  .black-key {
    width: 20px;
    height: 60%;
    background: #222;
    position: absolute;
    z-index: 2;
    border-radius: 0 0 3px 3px;
    transform: translateX(-50%);
  }
  .key.active {
    background: var(--acc) !important;
    box-shadow: 0 0 12px var(--acc);
  }
  button {
    background: var(--acc);
    color: #fff;
    border: 0;
    padding: 14px 28px;
    font-size: 18px;
    font-weight: 700;
    border-radius: 10px;
    cursor: pointer;
    width: 100%;
  }
</style>
</head>
<body>

<div class="card">
  <h2>Piano Note Detector</h2>
  <div id="note" class="note">--</div>
  <div id="freq" class="freq">0 Hz</div>

  <div class="keyboard-wrapper">
    <div id="keyboard" class="keyboard"></div>
  </div>

  <button id="btn" onclick="toggleMic()">Start Listening</button>
</div>

<script>
let audioCtx, analyser, micStream, isListening = false;
const notes = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const keyMap = {};

function buildKeyboard() {
  const kb = document.getElementById("keyboard");
  kb.innerHTML = "";
  let whiteIndex = 0;
  for (let octave = 3; octave <= 4; octave++) {
    notes.forEach((name, i) => {
      const isSharp = name.includes("#");
      const key = document.createElement("div");
      const midi = (octave + 1) * 12 + i;
      key.dataset.midi = midi;
      keyMap[midi] = key;
      if (!isSharp) {
        key.className = "white-key key";
        key.style.left = `${whiteIndex * 32}px`;
        whiteIndex++;
      } else {
        key.className = "black-key key";
        key.style.left = `${whiteIndex * 32}px`;
      }
      kb.appendChild(key);
    });
  }
  kb.style.width = `${whiteIndex * 32}px`;
}

async function toggleMic() {
  if (isListening) location.reload();

  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();
    if (audioCtx.state === "suspended") await audioCtx.resume();

    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });

    const source = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 4096;
    source.connect(analyser);

    document.getElementById("btn").textContent = "Stop Listening";
    isListening = true;
    detect();
  } catch (err) {
    alert("Mobile error: " + (err.message || err.name) + ". Ensure you are on HTTPS, not HTTP.");
  }
}

function autoCorrelate(buf, sampleRate) {
  let rms = 0;
  for (let i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / buf.length);
  if (rms < 0.02) return -1;

  let r1 = 0, r2 = buf.length - 1, thres = 0.2;
  for (let i = 0; i < buf.length / 2; i++) {
    if (Math.abs(buf[i]) < thres) { r1 = i; break; }
  }
  for (let i = 1; i < buf.length / 2; i++) {
    if (Math.abs(buf[buf.length - i]) < thres) { r2 = buf.length - i; break; }
  }

  buf = buf.slice(r1, r2);
  let c = new Float32Array(buf.length);
  for (let i = 0; i < buf.length; i++) {
    for (let j = 0; j < buf.length - i; j++) {
      c[i] = c[i] + buf[j] * buf[j + i];
    }
  }

  let d = 0;
  while (c[d] > c[d + 1]) d++;
  let maxval = -1, maxpos = -1;
  for (let i = d; i < buf.length; i++) {
    if (c[i] > maxval) {
      maxval = c[i];
      maxpos = i;
    }
  }
  return sampleRate / maxpos;
}

function detect() {
  const buf = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(buf);
  const pitch = autoCorrelate(buf, audioCtx.sampleRate);

  document.querySelectorAll(".key").forEach(k => k.classList.remove("active"));

  if (pitch !== -1 && isFinite(pitch)) {
    const noteNum = 12 * (Math.log2(pitch / 440)) + 69;
    const rounded = Math.round(noteNum);
    const noteName = notes[rounded % 12];
    const octave = Math.floor(rounded / 12) - 1;

    document.getElementById("note").textContent = `${noteName}${octave}`;
    document.getElementById("freq").textContent = `${Math.round(pitch)} Hz`;

    if (keyMap[rounded]) {
      keyMap[rounded].classList.add("active");
    }
  }

  if (isListening) requestAnimationFrame(detect);
}

buildKeyboard();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
