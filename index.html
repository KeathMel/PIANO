<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moonlight Practice</title>
<meta name="theme-color" content="#0f1a2b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Moonlight">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg:#0f1a2b; --panel:#182740; --line:#26385a; --text:#eef3fb; --muted:#92a3bd;
    --rh:#ff8a5c; --lh:#5cb8ff; --ok:#3ddc84; --bad:#ff4d6d; --accent:#ff6b4a;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text);
    display:flex; flex-direction:column; overflow:hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-user-select:none; user-select:none;
  }
  header { padding:8px 10px 6px; display:flex; flex-direction:column; gap:6px; background:var(--panel); border-bottom:1px solid var(--line); }
  .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  select, input[type=number] {
    background:#0f1a2b; color:var(--text); border:1px solid var(--line); border-radius:8px;
    padding:7px 8px; font-size:15px;
  }
  select#seg { flex:1; min-width:0; }
  input[type=number] { width:58px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
  .seg button { background:transparent; color:var(--muted); border:0; padding:7px 11px; font-size:14px; font-weight:600; cursor:pointer; }
  .seg button.on { background:var(--accent); color:#fff; }
  .tempo { display:flex; align-items:center; gap:8px; flex:1; min-width:200px; }
  .tempo input { flex:1; accent-color:var(--accent); }
  .tempo span { font-size:13px; color:var(--muted); white-space:nowrap; min-width:96px; text-align:right; }
  .opts { display:none; gap:12px; flex-wrap:wrap; font-size:14px; color:var(--muted); }
  .opts.show { display:flex; }
  .opts label { display:flex; align-items:center; gap:5px; }
  .gear { background:transparent; border:1px solid var(--line); color:var(--muted); border-radius:8px; padding:6px 9px; font-size:15px; cursor:pointer; }
  #custom { display:none; gap:6px; align-items:center; font-size:14px; color:var(--muted); }
  #custom.show { display:flex; }

  .status { display:flex; justify-content:space-between; align-items:flex-end; padding:8px 12px 4px; gap:10px; }
  .next { font-size:30px; font-weight:800; letter-spacing:0.5px; line-height:1.1; }
  .next small { display:block; font-size:12px; font-weight:600; color:var(--muted); letter-spacing:0; }
  .next .r { color:var(--rh); } .next .l { color:var(--lh); }
  .stats { text-align:right; font-size:13px; color:var(--muted); line-height:1.45; }
  .stats b { color:var(--text); }
  #heard { font-weight:700; }
  #heard.ok { color:var(--ok); } #heard.bad { color:var(--bad); }
  .meter { display:inline-block; width:48px; height:6px; background:#0b1322; border-radius:3px; vertical-align:middle; overflow:hidden; }
  .meter i { display:block; height:100%; width:0; background:var(--ok); }

  #stage { flex:1; position:relative; min-height:160px; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #banner {
    position:absolute; left:50%; top:38%; transform:translate(-50%,-50%);
    background:rgba(24,39,64,0.94); border:1px solid var(--line); border-radius:14px;
    padding:14px 20px; text-align:center; font-size:16px; display:none; max-width:86%;
  }
  #banner.show { display:block; }
  #banner b { font-size:26px; display:block; margin-bottom:4px; }

  footer { display:flex; gap:8px; padding:8px 10px 10px; background:var(--panel); border-top:1px solid var(--line); }
  footer button {
    flex:1; border:0; border-radius:11px; padding:13px 6px; font-size:16px; font-weight:700; cursor:pointer;
    background:#24395c; color:var(--text);
  }
  footer button.main { background:var(--accent); color:#fff; flex:1.6; }
  footer button.small { flex:0.55; }
  footer button:disabled { opacity:0.4; }
</style>
</head>
<body>

<header>
  <div class="row">
    <select id="seg" aria-label="Segment"></select>
    <button class="gear" id="gear" aria-label="More options">⚙</button>
  </div>
  <div class="row" id="custom">
    Bars <input type="number" id="from" min="1" max="69" value="1"> to <input type="number" id="to" min="1" max="69" value="4">
  </div>
  <div class="row">
    <div class="seg" id="mode">
      <button data-v="wait" class="on">Wait for me</button><button data-v="rhythm">In rhythm</button>
    </div>
    <div class="seg" id="hand">
      <button data-v="R" class="on">Right</button><button data-v="L">Left</button><button data-v="B">Both</button>
    </div>
  </div>
  <div class="row">
    <div class="tempo">
      <input type="range" id="bpm" min="12" max="60" step="1" value="26" aria-label="Tempo">
      <span id="bpmLabel"></span>
    </div>
  </div>
  <div class="opts" id="opts">
    <label><input type="checkbox" id="click" checked> Metronome click</label>
    <label><input type="checkbox" id="auto" checked> Speed up after a good loop</label>
    <label><input type="checkbox" id="accomp"> Play other hand (headphones)</label>
    <label><input type="checkbox" id="names" checked> Note names</label>
    <label><input type="checkbox" id="strict"> Exact octave</label>
    <label>Mic sensitivity <input type="range" id="sens" min="1" max="10" value="6"></label>
  </div>
</header>

<div class="status">
  <div class="next"><small id="nextLabel">Next note</small><span id="next">–</span></div>
  <div class="stats">
    <div>Bar <b id="bar">1</b> · Loop <b id="loop">0</b> · <span id="acc">–</span></div>
    <div>Heard: <span id="heard">–</span> <span class="meter"><i id="level"></i></span></div>
  </div>
</div>

<div id="stage">
  <canvas id="cv"></canvas>
  <div id="banner"></div>
</div>

<footer>
  <button id="listen">▶ Listen</button>
  <button id="go" class="main">🎤 Practice</button>
  <button id="back" class="small" aria-label="Previous note">◀</button>
  <button id="skip" class="small" aria-label="Skip note">▶▶</button>
</footer>

}
function init() {
  SEGMENTS.forEach((s, i) => {
    const o = document.createElement("option"); o.value = i;
    o.textContent = s.custom ? s.name : `${s.name}  (bars ${s.from}–${s.to})`;
    $("seg").appendChild(o);
  });
  $("seg").value = S.segIdx;
  $("from").value = S.from; $("to").value = S.to;
  setSeg($("mode"), S.mode); setSeg($("hand"), S.hand);
  $("bpm").value = S.bpm; updateBpmLabel();
  for (const k of ["click", "auto", "accomp", "names", "strict"]) {
    $(k).checked = S[k]; $(k).onchange = () => { S[k] = $(k).checked; save(); };
  }
  $("sens").value = S.sens; $("sens").oninput = () => { S.sens = +$("sens").value; save(); };
  $("seg").onchange = () => { S.segIdx = +$("seg").value; rebuild(); };
  $("from").onchange = $("to").onchange = () => { S.from = +$("from").value; S.to = +$("to").value; rebuild(); };
  $("mode").onclick = e => { const v = e.target.dataset?.v; if (!v) return; S.mode = v; setSeg($("mode"), v); rebuild(); };
  $("hand").onclick = e => { const v = e.target.dataset?.v; if (!v) return; S.hand = v; setSeg($("hand"), v); rebuild(); };
  $("bpm").oninput = () => { S.bpm = +$("bpm").value; updateBpmLabel(); save(); };
  $("gear").onclick = () => $("opts").classList.toggle("show");
  $("go").onclick = () => (state === "wait" || state === "rhythm") ? stopAll() : startPractice();
  $("listen").onclick = () => state === "listen" ? stopAll() : startListen();
  $("skip").onclick = () => {
    if (!steps[cur]) return;
    // hear the note, then move on (mic ignores this sound for a moment)
    const a = audio(); det.muteUntil = a.currentTime + 0.9;
    steps[cur].notes.forEach(n => playNote(n.m, a.currentTime + 0.01, 0.8, 0.3));
    steps[cur].status = null; cur++;
    if (state === "idle") ph = steps[cur] ? steps[cur].t : seg.end;
    if (cur >= steps.length) { state === "wait" ? finishLoop() : (cur = 0, ph = seg.start); }
  };
  $("back").onclick = () => {
    if (cur > 0) { cur--; steps[cur].status = null; }
    const a = audio(); det.muteUntil = a.currentTime + 0.9;
    steps[cur].notes.forEach(n => playNote(n.m, a.currentTime + 0.01, 0.8, 0.3));
    if (state === "idle") ph = steps[cur].t;
  };
  buildSegment(); resetRun(); updateButtons();
  $("custom").classList.toggle("show", !!SEGMENTS[S.segIdx].custom);
  resize(); requestAnimationFrame(tick);
}
init();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(console.error));
}
</script>
</body>
