<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Note Pitch Detector</title>
<meta name="theme-color" content="#0f1a2b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pitch">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #0f1a2b;
    color: #eef3fb;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
  }
  .card {
    background: #182740;
    border: 1px solid #26385a;
    border-radius: 16px;
    padding: 32px;
    text-align: center;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .note {
    font-size: 80px;
    font-weight: 800;
    color: #ff6b4a;
    margin: 20px 0 10px;
    min-height: 100px;
  }
  .freq {
    font-size: 18px;
    color: #92a3bd;
    margin-bottom: 24px;
  }
  button {
    background: #ff6b4a;
    color: #fff;
    border: 0;
    padding: 14px 28px;
    font-size: 18px;
    font-weight: 700;
    border-radius: 10px;
    cursor: pointer;
    width: 100%;
  }
</style>
</head>
<body>

<div class="card">
  <h2>Piano Note Detector</h2>
  <div id="note" class="note">--</div>
  <div id="freq" class="freq">0 Hz</div>
  <button id="btn" onclick="toggleMic()">Start Listening</button>
</div>

<script>
let audioCtx, analyser, micStream, isListening = false;
const notes = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

let rafId;

async function toggleMic() {
  if (isListening) return stopMic();

  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") await audioCtx.resume(); // iOS needs this
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    const source = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 4096;
    source.connect(analyser);

    document.getElementById("btn").textContent = "Stop Listening";
    isListening = true;
    detect();
  } catch (err) {
    alert("Microphone access denied or not supported. (Needs HTTPS.)");
  }
}

function stopMic() {
  isListening = false;
  cancelAnimationFrame(rafId);
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (audioCtx) audioCtx.close();
  document.getElementById("btn").textContent = "Start Listening";
  document.getElementById("note").textContent = "--";
  document.getElementById("freq").textContent = "0 Hz";
}

function autoCorrelate(buf, sampleRate) {
  let rms = 0;
  for (let i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / buf.length);
  if (rms < 0.02) return -1; // Ignore silence/background noise

  let r1 = 0, r2 = buf.length - 1, thres = 0.2;
  for (let i = 0; i < buf.length / 2; i++) {
    if (Math.abs(buf[i]) < thres) { r1 = i; break; }
  }
  for (let i = 1; i < buf.length / 2; i++) {
    if (Math.abs(buf[buf.length - i]) < thres) { r2 = buf.length - i; break; }
  }

  buf = buf.slice(r1, r2);
  let c = new Float32Array(buf.length);
  for (let i = 0; i < buf.length; i++) {
    for (let j = 0; j < buf.length - i; j++) {
      c[i] = c[i] + buf[j] * buf[j + i];
    }
  }

  let d = 0;
  while (c[d] > c[d + 1]) d++;
  let maxval = -1, maxpos = -1;
  for (let i = d; i < buf.length; i++) {
    if (c[i] > maxval) {
      maxval = c[i];
      maxpos = i;
    }
  }
  let T0 = maxpos;
  return sampleRate / T0;
}

function detect() {
  const buf = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(buf);
  const pitch = autoCorrelate(buf, audioCtx.sampleRate);

  if (pitch !== -1) {
    const noteNum = 12 * (Math.log2(pitch / 440)) + 69;
    const rounded = Math.round(noteNum);
    const noteName = notes[rounded % 12];
    const octave = Math.floor(rounded / 12) - 1;
    
    document.getElementById("note").textContent = `${noteName}${octave}`;
    document.getElementById("freq").textContent = `${Math.round(pitch)} Hz`;
  }
  
  if (isListening) rafId = requestAnimationFrame(detect);
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(console.error);
  });
}
</script>

</body>
</html>
